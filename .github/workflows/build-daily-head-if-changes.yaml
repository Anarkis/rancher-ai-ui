name: Daily Extension Catalog Build

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at 00:00 AM UTC
  workflow_dispatch:

# Prevents race conditions and limits job-level concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Restrict default permissions to none at the top workflow level
permissions: {}

jobs:
  check-changes:
    name: Check for new commits on main
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      current_sha: ${{ steps.check.outputs.current_sha }}
    steps:
      - name: Checkout main branch
        # Action is pinned to full 40-character commit SHA for supply-chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Compare current SHA against last built SHA
        id: check
        # Passed as environment variables to prevent shell template injection
        env:
          EVENT_NAME: ${{ github.event_name }}
          LAST_BUILT_SHA: ${{ vars.LAST_BUILT_MAIN_SHA }}
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "current_sha=${CURRENT_SHA}" >> "$GITHUB_OUTPUT"

          if [[ "${CURRENT_SHA}" != "${LAST_BUILT_SHA}" ]] || [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "=> New commits detected (${CURRENT_SHA} vs ${LAST_BUILT_SHA}). Proceeding."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "=> Head of main (${CURRENT_SHA}) has not changed since last build. Skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  call-build-workflow:
    name: Build extension catalog
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    
    permissions:
      actions: write # Required to allow the reusable workflow to build artifacts and publish container packages
      contents: read 
      packages: write # Required to allow the reusable workflow to build artifacts and publish container packages
    uses: rancher/dashboard/.github/workflows/build-extension-catalog.yml@04e9b18ed96b496b9d80c3a7d7c6b1788330dc85
    with:
      registry_target: "ghcr.io"
      registry_user: ${{ github.actor }}
      tagged_release: "head"
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}

  update-last-built-sha:
    name: Save built commit SHA
    needs: [check-changes, call-build-workflow]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    permissions:
      variables: write # Required to write to GitHub repository variables via gh CLI
    steps:
      - name: Update Repository Variable
        # Passed as environment variables to prevent shell template injection and identify repo without git checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ needs.check-changes.outputs.current_sha }}
        run: |
          gh variable set LAST_BUILT_MAIN_SHA --body "${CURRENT_SHA}"
